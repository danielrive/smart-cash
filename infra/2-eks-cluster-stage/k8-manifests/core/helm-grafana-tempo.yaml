apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-tempo
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: tempo-distributed
      version: 1.60.0
      sourceRef:
        kind: HelmRepository
        name: grafana-tempo
        namespace: flux-system
  values:
    # 1. Traces config must be at the top level of 'values'
    traces:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
    
    # 2. Storage config must also be at the top level
    storage:
      trace:
        backend: s3
        s3:
          bucket: ${S3_BUCKET_GRAFANA_TEMPO}
          endpoint: "s3.amazonaws.com"
          region: ${AWS_REGION}
          prefix: "tempo"
          insecure: false

    # 3. Component-specific overrides (Optional)
    distributor:
      replicas: 2
      # The chart automatically handles receivers if 'traces' is enabled above.
      # No need for a manual 'receivers' block here unless you have custom logic.

    # 4. Global image settings (Correct way to set registry/tag)
    global:
      image:
        registry: docker.io
        repository: grafana/tempo
        tag: "2.9.0" # It is safer to specify a version