apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-tempo
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: tempo-distributed
      version: 1.60.0
      sourceRef:
        kind: HelmRepository
        name: grafana-tempo
        namespace: flux-system
  values:
    tempo:
      registry: docker.io
      repository: grafana/tempo
      tag: ""
      pullPolicy: IfNotPresent
      updateStrategy: RollingUpdate
      storage:
        trace:
          backend: s3
          s3:
            bucket: $S3_BUCKET_GRAFANA_TEMPO # Replace with your S3 bucket name
            endpoint: "s3.amazonaws.com"
            region: $AWS_REGION # Replace with your AWS region, e.g., us-west-2
            prefix: "tempo"
            insecure: false
      traces: 
        otlp: 
          grpc: 
            enabled: true 
          http: 
            enabled: true
        distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              enabled: true
            http:
              enabled: true
