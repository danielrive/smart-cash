apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: jwt-secret
  namespace: ${ENVIRONMENT}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "${JWT_SECRET_NAME}"
        objectType: "secretsmanager"
        jmesPath:
          - path: secret
            objectAlias: secret
    usePodIdentity: "true"
